[tool.poetry]
name = "attendance-backend"
version = "0.1.0"
description = "Multi-campus face-recognition attendance system — backend"
authors = ["Your Team <team@example.com>"]
packages = [
    { include = "backend" },
    { include = "ml" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# ── Web framework ─────────────────────────────────────────────────────────────
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
python-multipart = "^0.0.9"          # file upload support

# ── Database ──────────────────────────────────────────────────────────────────
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.30.0"                  # async PostgreSQL driver
greenlet = "^3.1.0"                  # required by SQLAlchemy async engine
psycopg2-binary = "^2.9.10"          # sync driver for Alembic only
alembic = "^1.13.1"
pgvector = "^0.3.2"                  # SQLAlchemy + psycopg pgvector types

# ── Auth / security ───────────────────────────────────────────────────────────
passlib = { version = "^1.7.4", extras = ["argon2"] }
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
argon2-cffi = "^23.1.0"

# ── Configuration ─────────────────────────────────────────────────────────────
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# ── Cache / queue ─────────────────────────────────────────────────────────────
redis = { version = "^5.0.4", extras = ["hiredis"] }
azure-servicebus = "^7.12.1"

# ── Storage ───────────────────────────────────────────────────────────────────
azure-storage-blob = "^12.20.0"
azure-identity = "^1.17.0"          # managed identity for Key Vault + Blob
azure-keyvault-secrets = "^4.8.0"

# ── Observability ─────────────────────────────────────────────────────────────
structlog = "^24.2.0"

# ── HTTP client (for inter-service calls) ─────────────────────────────────────
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"                    # TestClient
anyio = "^4.4.0"
opencv-python-headless = "^4.10.0"  # ml/utils tests (cv2)

# Linting / formatting
black = "^24.4.2"
ruff = "^0.4.7"
isort = "^5.13.2"
pre-commit = "^3.7.1"

# Type checking
mypy = "^1.10.0"
types-redis = "^4.6.0.20240425"
types-passlib = "^1.7.7.20240327"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehension improvements
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplification
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.watchfiles]
# Exclude frontend node_modules from uvicorn's reload watcher
ignore_paths = ["frontend", ".git", "__pycache__", ".mypy_cache", ".pytest_cache"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
