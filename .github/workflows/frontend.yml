# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI/CD — lint, type-check, build; deploy to Azure Static Web Apps.
#
# Required repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN (from the SWA resource)
# ─────────────────────────────────────────────────────────────────────────────

name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  pull-requests: write # PR preview comments from the SWA action

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx next lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build (standalone output)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder-api.example.com

  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.STAGING_API_URL != ''
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build with deployed API URL
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: .next
